{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mb-4">
        <div class="card h-100">
            <div class="card-header py-3">
                <h4 class="mb-0"><i class="bi bi-webcam"></i> Reconhecimento em Tempo Real</h4>
            </div>
            <div class="card-body text-center bg-dark">
                <div id="webcam-container">
                    <!-- Video Element for Webcam -->
                    <video id="video-element" autoplay playsinline muted></video>
                    <!-- Canvas for Bounding Boxes -->
                    <canvas id="canvas-overlay"></canvas>
                </div>
                <div class="mt-3">
                    <p id="status-text" class="text-secondary">Aguardando permissão da câmera...</p>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-4 mb-4">
        <div class="card h-100">
            <div class="card-header py-3">
                <h4 class="mb-0"><i class="bi bi-list-check"></i> Resultados</h4>
            </div>
            <div class="card-body p-0" id="results-div">
                <div class="p-4 text-center text-secondary">
                    Iniciando reconhecimento...
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
