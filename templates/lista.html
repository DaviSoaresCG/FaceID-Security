{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-header py-3 d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-people"></i> Pessoas Cadastradas</h4>
        <a href="{{ url_for('cadastro') }}" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg"></i> Novo Cadastro</a>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-borderless mb-0">
                <thead class="bg-dark text-secondary">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Data de Cadastro</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in pessoas %}
                    <tr>
                        <td class="ps-4 align-middle"><span class="badge bg-secondary">#{{ p['id'] }}</span></td>
                        <td class="fw-bold align-middle">{{ p['nome'] }}</td>
                        <td class="align-middle">{{ p['cpf'] }}</td>
                        <td class="text-secondary align-middle">{{ p['data_cadastro'] }}</td>
                        <td class="text-end pe-4 align-middle">
                            <form action="{{ url_for('deletar', id=p['id']) }}" method="POST" class="d-inline" onsubmit="return confirm('Tem certeza que deseja excluir esta pessoa e todas as suas imagens?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Deletar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="text-center py-5 text-secondary">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            Nenhuma pessoa cadastrada ainda.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
